<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Média - FATEC</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1>Sistema de Notas - FATEC Diadema</h1>
        <h2>Desenvolvimento Web III</h2>
        <p>Informe as notas P1 e P2 através dos parâmetros na URL:</p>

        <div class="exemplo">
            <code>http://localhost:3000/media?p1=7.5&p2=5.0</code>
        </div>

        <h3>Testar Exemplo Direto:</h3>
        <div class="botoes-teste">
            <a href="/media?p1=7.5&p2=5.0" class="btn aprovado-btn">Testar Exemplo Aprovado (7.5 e 5.0)</a>
            <a href="/media?p1=4.0&p2=5.0" class="btn reprovado-btn">Testar Exemplo Reprovado (4.0 e 5.0)</a>
        </div>
    </main>
</body>
</html>
